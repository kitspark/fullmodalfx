name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package + tag
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [ "$PKG_NAME" != "@kitspark/fullmodalfx" ]; then
            echo "package.json name must be @kitspark/fullmodalfx (got: $PKG_NAME)"
            exit 1
          fi
          PKG_ACCESS="$(node -p "require('./package.json').publishConfig?.access || ''")"
          if [ "$PKG_ACCESS" != "public" ]; then
            echo "publishConfig.access must be public (got: $PKG_ACCESS)"
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Tag must start with v (got: ${GITHUB_REF_NAME})"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish
        run: npm publish --access public --provenance
